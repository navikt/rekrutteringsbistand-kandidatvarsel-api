name: Build and deploy
on: [push, workflow_dispatch]

jobs:
  call-build-and-deploy:
    uses: navikt/toi-github-actions-workflows/.github/workflows/build-and-deploy.yaml@v15
    with:
      java-version: "25"
      deploy-to-dev-if-branch-name-is: "fjern-trivy"
    permissions:
      contents: read
      id-token: write
      security-events: write
    secrets: inherit
